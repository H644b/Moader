name: Bug report
description: Report a problem with Moader.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        Use the private reporting link in the issue chooser for vulnerabilities.
        Keep pairing codes, private addresses, session data and game files out of reports.
  - type: checkboxes
    id: preparation
    attributes:
      label: Before filing
      options:
        - label: I checked the README and existing issues for this problem.
          required: true
        - label: My report contains no credentials or unredacted private data.
          required: true
  - type: input
    id: version
    attributes:
      label: Moader version
      description: Release tag or source commit used for this report (for example, v3.0.0).
      placeholder: v3.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include firmware and kaiHEN version if known. For setup problems, include your computer OS and Node version. For browser problems, include the browser version.
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Backend setup method
      options:
        - Unknown or manager only
        - SmileBASIC through kurumuz ns2jb
        - SmileBASIC through mac2jb
        - Seedsow Lullaby, PC-driven
        - Seedsow Lullaby, on-console (experimental)
        - CivSwitch (experimental)
        - Other (describe below)
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime setup
      options:
        - Unknown
        - Manager/browser only
        - Backend set up for this boot
        - Console rebooted since runtime installation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps, including any content reload, game relaunch or console reboot.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect? What did Moader display and what happened in the game?
    validations:
      required: true
  - type: dropdown
    id: lifecycle
    attributes:
      label: Did the game or manager close?
      options:
        - Neither closed
        - Closed normally by the user
        - Reported an error or was force-closed
        - Not applicable or unknown
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste the relevant error or debug lines. Remove pairing codes, addresses, account details, paths and session data.
      render: text
