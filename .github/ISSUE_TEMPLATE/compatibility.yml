name: Mod compatibility report
description: Report how a game and mod behave with Moader.
title: "[Compatibility]: "
labels: [compatibility, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        Tell us what changed in the game and whether you had to reopen it. Keep game and mod files out of the report.
  - type: input
    id: version
    attributes:
      label: Moader version
      description: Release tag or source commit used for this report (for example, v3.0.0).
      placeholder: v3.0.0
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game, edition, version and Title ID
      description: Include what you know. Leave unknown fields unknown.
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Backend setup method
      options:
        - Unknown
        - SmileBASIC through ns2jb or mac2jb
        - Seedsow Lullaby, PC-driven
        - Seedsow Lullaby, on-console (experimental)
        - CivSwitch (experimental)
        - Other (describe below)
  - type: input
    id: mod
    attributes:
      label: Mod name/version and public source link
      description: Use a public project page if available; do not link private downloads or attach copyrighted assets.
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Payload layout
      options:
        - Unknown
        - Loose RomFS files
        - RomFS image
        - ExeFS modules or executable patches
        - Mixed payload
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Setup and actions
      description: List your firmware and kaiHEN version if known. Say whether you set up the backend this boot and which mod actions you tried.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed game behavior
      description: Describe what you saw after enabling, disabling or removing the mod. Include any content reload, game relaunch or console reboot.
    validations:
      required: true
  - type: textarea
    id: native
    attributes:
      label: Native status and sanitized messages
      description: Include the apply state and relevant debug lines if available. Remove pairing codes and private details.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Sharing check
      options:
        - label: I included no credentials, private data, game assets or original-content dumps.
          required: true
