name: Feature request
description: Suggest a change to Moader.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe what you do now and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what you would like Moader to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Include any workarounds you have tried.
  - type: checkboxes
    id: sharing
    attributes:
      label: Sharing check
      options:
        - label: This request includes no credentials, private data or copyrighted game assets.
          required: true
