name: Feature request
description: Explain a workflow that Moader could improve.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the concrete workflow or problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result and how you would know it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Optional workarounds, relevant native/browser behavior or known compatibility limits.
  - type: checkboxes
    id: sharing
    attributes:
      label: Sharing check
      options:
        - label: This request includes no credentials, private data or copyrighted game assets.
          required: true
