name: Package Moader Setup apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Prebuilt macOS, Linux and Windows apps
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Stage only matched v4 native inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release-inputs
          gh release download v4.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Moader-backend-v4.0.0.zip' --dir build/release-inputs
          python3 tools/stage-release-inputs.py \
            --backend-zip build/release-inputs/Moader-backend-v4.0.0.zip
      - name: Package and verify five prebuilt desktop apps
        run: |
          python3 tools/package-release.py --output build/release-artifacts
          python3 tools/package-setup-platform.py --release-dir build/release-artifacts
          cd build/release-artifacts
          shasum -a 256 -c SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moader-v4-release-assets
          path: build/release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
