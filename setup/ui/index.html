<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121918">
  <title>Moader Setup</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="symbol-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7m-16-1v11h5v-6h4v6h5V9"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2.5v9m-4.8-6a8.4 8.4 0 1 0 9.6 0"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m3 8.2 9-4.7 9 4.7-9 4.7Zm0 4 9 4.7 9-4.7m-18 4 9 4.7 9-4.7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15.5 5V4a1 1 0 0 0-1-1h-10A1.5 1.5 0 0 0 3 4.5v10A1.5 1.5 0 0 0 4.5 16H5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 5v5h-5M4 19v-5h5M5.1 8.6a7.5 7.5 0 0 1 12.5-3L20 8m-16 8 2.4 2.4a7.5 7.5 0 0 0 12.5-3"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><path d="M2.3 8.6a15.2 15.2 0 0 1 19.4 0m-16.1 3.5a10.2 10.2 0 0 1 12.8 0m-9.6 3.4a5.2 5.2 0 0 1 6.4 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8Zm0 0v5h5M8.5 12h7m-7 3.5h5"/></symbol>
    <symbol id="i-display" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M12 18v3m-5 0h10"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.1a2.6 2.6 0 1 1 4.5 1.8c-1 1-2 1.2-2 2.9m0 2.5h.01"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M2 12h5l3-7 4 14 3.2-7H22"/></symbol>
  </svg>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="lockup" src="/lockup.svg" alt="Moader" width="162" height="35">
        <span class="app-name">Setup</span>
      </div>
      <div class="top-actions">
        <span id="kitBadge" class="badge">Checking kit</span>
        <button id="helpButton" class="quiet" type="button" aria-label="Help for this step" title="Help for this step">
          <svg class="icon" aria-hidden="true"><use href="#i-help"/></svg><span>Help for this step</span>
        </button>
      </div>
    </header>
    <div class="workspace">
      <nav class="rail" aria-label="Setup tasks">
        <p class="rail-title">Tasks</p>
        <label class="mobile-task-picker"><span>Task</span><select id="taskSelect">
          <option value="home">Home</option>
          <option value="boot">Set up for this boot</option>
          <option value="standalone">Prepare computer-free boots</option>
          <option value="copy">Copy app and plugin</option>
          <option value="reload">Update running service</option>
          <option value="connection">Check connection</option>
          <option value="browser">Open Moader in browser</option>
          <option value="report">Export support report</option>
        </select></label>
        <div class="task-nav">
          <button class="nav-item current" data-task="home" aria-current="page" type="button"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Home</button>
          <button class="nav-item" data-task="boot" type="button"><svg class="icon" aria-hidden="true"><use href="#i-power"/></svg>Set up for this boot</button>
          <button class="nav-item" data-task="standalone" type="button"><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg>Prepare computer-free boots</button>
          <button class="nav-item" data-task="copy" type="button"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>Copy app and plugin</button>
          <button class="nav-item" data-task="reload" type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>Update running service</button>
          <button class="nav-item" data-task="connection" type="button"><svg class="icon" aria-hidden="true"><use href="#i-network"/></svg>Check connection</button>
          <button class="nav-item" data-task="browser" type="button"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>Open Moader in browser</button>
          <button class="nav-item" data-task="report" type="button"><svg class="icon" aria-hidden="true"><use href="#i-report"/></svg>Export support report</button>
        </div>
        <div class="rail-bottom">
          <svg class="host-icon icon" aria-hidden="true"><use href="#i-display"/></svg>
          <div><span class="context-label">This computer</span><p id="platformLabel">Detecting computer</p></div>
        </div>
      </nav>
      <main id="main" tabindex="-1"><div class="content"><p class="hint" role="status">Opening Moader Setup…</p></div></main>
    </div>
    <aside id="activity" class="activity" aria-label="Current operation">
      <div class="activity-top">
        <svg class="activity-icon icon" aria-hidden="true"><use href="#i-activity"/></svg>
        <div class="activity-copy">
          <strong id="activityTitle">No task running</strong>
          <p id="activityMessage"></p>
        </div>
        <span id="activityState" class="state-label"></span>
      </div>
      <button id="activityRoute" class="activity-link" type="button" hidden></button>
      <details id="technicalDetails">
        <summary>Technical details and recent events</summary>
        <div id="eventList" class="event-list"></div>
      </details>
    </aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
